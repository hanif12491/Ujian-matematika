<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CBT Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-600">LOGIN CBT SEKOLAH</h1>
            <p class="text-xs text-gray-500">Silakan masukkan akun Anda untuk masuk sistem</p>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold text-sm mb-1">Username / NIS / NIP</label>
                <input type="text" id="login-id" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Masukkan NIS atau NIP..." required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 font-semibold text-sm mb-1">Password</label>
                <input type="password" id="login-pass" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Masukkan password..." required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition text-sm">MASUK SISTEM</button>
        </form>
        <div class="mt-4 text-center text-xs">
            <a href="index.html" class="text-blue-600 hover:underline">← Kembali ke Beranda</a>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('login-id').value.trim();
            const pass = document.getElementById('login-pass').value;

            let usersDB = JSON.parse(localStorage.getItem('cbt_users_db')) || [];
            const user = usersDB.find(u => u.nis === id && u.password === pass);

            if (user) {
                alert(`Login Berhasil! Selamat datang, ${user.nama}`);
                if (user.role === 'guru') {
                    window.location.href = 'admin/ujian.php';
                } else {
                    window.location.href = 'profil.html';
                }
            } else {
                alert("Login Gagal! Periksa kembali NIS/NIP dan password Anda.");
            }
        }
    </script>
</body>
</html>
