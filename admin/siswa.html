<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manajemen Siswa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <nav class="bg-green-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">Admin Panel - Data Siswa</h1>
        <a href="ujian.html" class="bg-white text-green-600 px-3 py-1.5 rounded text-sm font-bold">← Kelola Ujian</a>
    </nav>

    <div class="container mx-auto p-6 max-w-5xl">
        <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="font-bold text-lg mb-4 text-gray-800">Daftar Akun Siswa Terdaftar</h3>
            <table class="w-full border-collapse border border-gray-300 text-sm">
                <thead>
                    <tr class="bg-gray-100">
                        <th class="border p-2">NIS</th>
                        <th class="border p-2">Nama Siswa</th>
                        <th class="border p-2">Jenjang</th>
                        <th class="border p-2">Kelas</th>
                        <th class="border p-2">Sekolah</th>
                    </tr>
                </thead>
                <tbody id="student-table-body">
                    <!-- Data dimuat dari localStorage -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let usersDB = JSON.parse(localStorage.getItem('cbt_users_db')) || [];
        const tbody = document.getElementById('student-table-body');
        
        const students = usersDB.filter(u => u.role === 'siswa');
        if (students.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-gray-500">Belum ada data siswa terdaftar.</td></tr>`;
        } else {
            students.forEach(s => {
                tbody.innerHTML += `
                    <tr>
                        <td class="border p-2">${s.nis}</td>
                        <td class="border p-2 font-semibold">${s.nama}</td>
                        <td class="border p-2">${s.jenjang || '-'}</td>
                        <td class="border p-2">Kelas ${s.kelas || '-'}</td>
                        <td class="border p-2">${s.sekolah || '-'}</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
